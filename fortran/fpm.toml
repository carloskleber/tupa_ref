name = "Tupa"
version = "0.0.1"
license = "GPL-3.0-or-later"
author = "Carlos Kleber C. Arruda"
maintainer = "carloskleber@gmail.com"
copyright = "Copyright 2026, Carlos Kleber"
dependencies.stdlib = "*"
dependencies.feh = { git = "https://github.com/samharrison7/fortran-error-handler" }

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["lapack", "blas", "slatec"]
external-modules = ["slatec"]

[install]
library = false
test = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[example]]
name = "example1"
main = "example1.f90"

[[example]]
name = "example3"
main = "example3.f90"

[extra.ford]
project = "TUPÃ"
preprocess = false

summary = """
Reference model for electromagnetic field transient simulations — codename TUPÃ.

TUPÃ computes the frequency-domain (and, via inverse transform, time-domain)
response of networks of thin cylindrical conductors in air and soil — tower
footings, counterpoises, grounding grids — under lightning-type excitation.
It is an application of the Method of Moments (MoM), known in the power
community as the Hybrid Electromagnetic Model (HEM).
"""