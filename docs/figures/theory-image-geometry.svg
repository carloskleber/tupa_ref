<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Direct and image paths between two buried segments</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f4e79"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a2e"/></marker>
<marker id="k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="28" font-size="15" font-weight="bold" fill="#222">Images at the air–soil interface (pair of buried segments)</text>
<rect x="0" y="190" width="680" height="190" fill="#efe3cf"/>
<line x1="0" y1="190" x2="680" y2="190" stroke="#555" stroke-width="2"/>
<text x="560" y="182" fill="#222">air  (z &gt; 0)</text><text x="560" y="208" fill="#222">soil  (z &lt; 0)</text>
<text x="20" y="182" fill="#555">z = 0</text>
<line x1="120" y1="290" x2="260" y2="270" stroke="#222" stroke-width="7" stroke-linecap="round"/>
<text x="150" y="318" fill="#222" font-weight="bold">segment b (source)</text>
<line x1="120" y1="90" x2="260" y2="110" stroke="#888" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 7"/>
<text x="110" y="72" fill="#666" font-weight="bold">image of b  (current × Γ)</text>
<line x1="430" y1="300" x2="560" y2="300" stroke="#222" stroke-width="7" stroke-linecap="round"/>
<text x="450" y="328" fill="#222" font-weight="bold">segment a (observer)</text>
<line x1="190" y1="280" x2="495" y2="300" stroke="#1f4e79" stroke-width="2" marker-end="url(#a)"/>
<text x="310" y="282" fill="#1f4e79" font-weight="bold">R̄  (direct)</text>
<line x1="190" y1="100" x2="495" y2="298" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="350" y="170" fill="#b03a2e" font-weight="bold">R̄ᵢ  (via the image)</text>
<line x1="190" y1="100" x2="190" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<text x="60" y="240" fill="#555">depth h</text><text x="60" y="150" fill="#555">height h</text>
<text x="20" y="356" fill="#222">Z = c·( e^(−γR̄)·g  +  Γ·e^(−γR̄ᵢ)·gᵢ ).  Γ → +1 for a pair in soil, Γ → −1 for a pair in air.</text>
</svg>
