<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 372" width="710" height="372" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Transient pipeline with FFT or Numerical Laplace Transform</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f4e79"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a2e"/></marker>
<marker id="k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#222">From a current waveform to a voltage waveform</text><rect x="20" y="60" width="150" height="54" rx="6" fill="#dfe9f3" stroke="#555"/><text x="95.0" y="83" text-anchor="middle" fill="#222" font-weight="bold">i(t), N samples</text><text x="95.0" y="102" text-anchor="middle" fill="#444" font-size="12">rise time, tail taper</text><line x1="170" y1="87" x2="200" y2="87" stroke="#333" stroke-width="2" marker-end="url(#k)"/><rect x="200" y="60" width="150" height="54" rx="6" fill="#f9e7c4" stroke="#555"/><text x="275.0" y="83" text-anchor="middle" fill="#222" font-weight="bold">× e^(−ct)</text><text x="275.0" y="102" text-anchor="middle" fill="#444" font-size="12">NLT only (c = 0: FFT)</text><line x1="350" y1="87" x2="380" y2="87" stroke="#333" stroke-width="2" marker-end="url(#k)"/><rect x="380" y="60" width="130" height="54" rx="6" fill="#dfe9f3" stroke="#555"/><text x="445.0" y="83" text-anchor="middle" fill="#222" font-weight="bold">FFT</text><text x="445.0" y="102" text-anchor="middle" fill="#444" font-size="12">spectrum I(sₖ)</text><line x1="510" y1="87" x2="540" y2="87" stroke="#333" stroke-width="2" marker-end="url(#k)"/><rect x="540" y="60" width="150" height="54" rx="6" fill="#f6d9d5" stroke="#555"/><text x="615.0" y="83" text-anchor="middle" fill="#222" font-weight="bold">× H(sₖ)</text><text x="615.0" y="102" text-anchor="middle" fill="#444" font-size="12">one solve per sₖ</text><line x1="615" y1="114" x2="615" y2="160" stroke="#333" stroke-width="2" marker-end="url(#k)"/><rect x="540" y="160" width="150" height="54" rx="6" fill="#dfe9f3" stroke="#555"/><text x="615.0" y="183" text-anchor="middle" fill="#222" font-weight="bold">window / filter</text><text x="615.0" y="202" text-anchor="middle" fill="#444" font-size="12">optional</text><line x1="540" y1="187" x2="510" y2="187" stroke="#333" stroke-width="2" marker-end="url(#k)"/><rect x="380" y="160" width="130" height="54" rx="6" fill="#dfe9f3" stroke="#555"/><text x="445.0" y="183" text-anchor="middle" fill="#222" font-weight="bold">inverse FFT</text><text x="445.0" y="202" text-anchor="middle" fill="#444" font-size="12">conjugate symmetry</text><line x1="380" y1="187" x2="350" y2="187" stroke="#333" stroke-width="2" marker-end="url(#k)"/><rect x="200" y="160" width="150" height="54" rx="6" fill="#f9e7c4" stroke="#555"/><text x="275.0" y="183" text-anchor="middle" fill="#222" font-weight="bold">× e^(+ct)</text><text x="275.0" y="202" text-anchor="middle" fill="#444" font-size="12">NLT only</text><line x1="200" y1="187" x2="170" y2="187" stroke="#333" stroke-width="2" marker-end="url(#k)"/><rect x="20" y="160" width="150" height="54" rx="6" fill="#dfe9f3" stroke="#555"/><text x="95.0" y="183" text-anchor="middle" fill="#222" font-weight="bold">v(t)</text><text x="95.0" y="202" text-anchor="middle" fill="#444" font-size="12">node voltages, currents</text><text x="20" y="252" fill="#222">sₖ = c + jωₖ on a linear grid, k = 0 … N/2.</text><text x="20" y="272" fill="#222">FFT path: c = 0, and the k = 0 bin is solved at a small substitute frequency.</text>
<text x="20" y="292" fill="#222">H(sₖ): the system of §6 with a unit current injected, solved at every sₖ</text><text x="20" y="312" fill="#222">or interpolated from a coarser scan.</text>
<text x="20" y="336" fill="#b03a2e">The undamping factor e^(+ct) reaches e^(cT) at the end of the record,</text><text x="20" y="356" fill="#b03a2e">so errors there are amplified.</text></svg>
