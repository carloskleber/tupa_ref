<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Segment with end currents, leakage current and node voltages</title>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f4e79"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b03a2e"/></marker>
<marker id="k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="20" y="28" font-size="15" font-weight="bold" fill="#222">One segment and its unknowns</text>
<rect x="150" y="118" width="380" height="16" rx="8" fill="#c9c9c9" stroke="#555"/>
<circle cx="150" cy="126" r="9" fill="#222"/><circle cx="530" cy="126" r="9" fill="#222"/>
<text x="118" y="100" fill="#222">node n₁</text><text x="500" y="100" fill="#222">node n₂</text>
<text x="108" y="160" fill="#222">u(n₁)</text><text x="512" y="160" fill="#222">u(n₂)</text>
<line x1="165" y1="108" x2="235" y2="108" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#a)"/>
<text x="185" y="98" fill="#1f4e79" font-weight="bold">I₁</text>
<line x1="515" y1="108" x2="445" y2="108" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#a)"/>
<text x="470" y="98" fill="#1f4e79" font-weight="bold">I₂</text>
<g stroke="#b03a2e" stroke-width="2">
<line x1="250" y1="138" x2="250" y2="186" marker-end="url(#r)"/><line x1="310" y1="138" x2="310" y2="186" marker-end="url(#r)"/>
<line x1="370" y1="138" x2="370" y2="186" marker-end="url(#r)"/><line x1="430" y1="138" x2="430" y2="186" marker-end="url(#r)"/>
<line x1="280" y1="114" x2="280" y2="66" marker-end="url(#r)"/><line x1="340" y1="114" x2="340" y2="66" marker-end="url(#r)"/>
<line x1="400" y1="114" x2="400" y2="66" marker-end="url(#r)"/>
</g>
<text x="250" y="208" fill="#b03a2e" font-weight="bold">Iₜ = I₁ + I₂  leaks uniformly into the medium</text>
<line x1="290" y1="126" x2="390" y2="126" stroke="#1f4e79" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="150" y="246" fill="#1f4e79" font-weight="bold">Iℓ = (I₁ − I₂)/2  mean current along the axis (dashed)</text>
<text x="150" y="276" fill="#222">Both end currents are positive into the segment. Length l, radius r₀.</text>
</svg>
